[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "javes-ai-routing"
version = "0.1.0"
description = "JAVES-AI routing, Main Infra controls, durable Retention, and shared contracts"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "argon2-cffi>=21.3,<26",
  "Pillow>=13,<14",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "opentelemetry-instrumentation-httpx>=0.49b0,<1",
  "opentelemetry-instrumentation-logging>=0.49b0,<1",
  "protobuf<7",
  "cryptography>=46,<47",
]
infra = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "opentelemetry-instrumentation-httpx>=0.49b0,<1",
  "opentelemetry-instrumentation-logging>=0.49b0,<1",
  "protobuf<7",
  "cryptography>=46,<47",
]

perception = [
  "opencv-python!=4.13.0.90,>=4.10,<6",
  "ultralytics>=8.4",
  "torchreid==0.2.5",
  "scipy",
  "tensorboard",
  "gdown",
  "lap",
]

[project.scripts]
javes-routing-demo = "javes_routing.service.demo:main"
javes-routing-bench = "javes_routing.service.bench:main"
javes-routing-calibrate = "javes_routing.service.timing_calibration:main"
javes-routing-shadow = "javes_routing.service.shadow_benchmark:main"
javes-main-migrate = "javes_main.persistence.migrate:main"
javes-main-backup = "javes_main.persistence.backup:main"
javes-main-replay-audit = "javes_main.replay_audit:main"
javes-main-audit-export = "javes_main.application.audit_export_cli:main"
javes-main-incident-snapshot = "javes_main.application.incident_snapshot_cli:main"
javes-token-rotation = "javes_security.cli:main"
javes-main-bootstrap-root = "javes_main.application.auth_cli:main"
javes-contract-schemas = "javes_contracts.schema:main"
javes-contract-bundle = "javes_contracts.bundle:main"
javes-retention-inspect = "javes_retention.runtime.cli:main"
javes-perception-probe = "javes_perception.runtime.cli:main"
javes-main-api = "javes_main.api_cli:main"
javes-main-scheduler = "javes_main.scheduler_cli:main"
javes-main-dlq = "javes_main.application.dlq_cli:main"
javes-routing-api = "javes_routing.service.cli:main"
javes-site-config-api = "javes_site_config.cli:main"
javes-site-config-publish = "javes_site_config.publisher_cli:main"
javes-site-config-nvidia = "javes_site_config.nvidia_cli:main"
javes-perception-worker = "javes_perception.runtime.worker_cli:main"
javes-retention-worker = "javes_retention.runtime.worker_cli:main"
javes-clip-worker = "javes_clip.worker_cli:main"
javes-nvidia-archive-api = "javes_archive.cli:api_main"
javes-nvidia-archive-inspect = "javes_archive.cli:inspect_main"
javes-nvidia-acceptance = "javes_release.cli:main"
javes-dashboard = "javes_dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["javes_routing*", "javes_contracts*", "javes_main*", "javes_retention*", "javes_perception*", "javes_site_config*", "javes_workers*", "javes_clip*", "javes_archive*", "javes_release*", "javes_telemetry*", "javes_security*", "javes_dashboard*"]

[tool.setuptools.package-data]
"javes_main.persistence.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "real_cv: uses tracked videos and actual detector/Re-ID models",
]
