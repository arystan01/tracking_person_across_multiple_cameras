name: security

on:
  workflow_dispatch:
  push:
    paths: ["pyproject.toml", "Dockerfile", ".github/workflows/security.yml"]
  schedule:
    - cron: "17 3 * * 1"

jobs:
  dependency-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade 'pip>=26.2.0' 'setuptools>=84.1.0'
      - run: python -m pip install -e '.[infra]' pip-audit cyclonedx-bom
      - run: python -m pip_audit
      - run: cyclonedx-py environment --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with: {name: python-sbom, path: sbom.json}

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t javes-ai:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: javes-ai:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  clip-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target clip-runtime -t javes-clip:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: javes-clip:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
