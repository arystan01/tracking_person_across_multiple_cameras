name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test,infra]'
      - run: python -m pytest -q -m 'not real_cv'
      - run: python -m javes_main.security --root .

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: javes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d javes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JAVES_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/javes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[test,infra]'
      - run: python -m pytest -q tests/test_postgres_integration.py

  real-cv:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test,infra,perception]'
      - run: JAVES_RUN_REAL_CV=1 python -m pytest -q -m real_cv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-cv-e2e-output
          path: artifacts/real-cv-e2e/
          if-no-files-found: warn
