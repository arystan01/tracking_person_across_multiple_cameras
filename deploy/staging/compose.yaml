name: javes-staging

x-telemetry: &telemetry
  JAVES_OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  JAVES_DEPLOYMENT_ENVIRONMENT: staging
  JAVES_SERVICE_VERSION: local-staging

x-hardened: &hardened
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  networks: [javes-internal]

x-service-build: &service-build
  context: ../..
  dockerfile: Dockerfile
  target: runtime

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: javes
      POSTGRES_USER: javes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example and set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U javes -d javes"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [javes-internal]
    deploy: {resources: {limits: {cpus: "2", memory: 2G}}}

  volume-init:
    image: alpine:3.21
    user: "0:0"
    command: [sh, -ec, "chown -R 10001:10001 /artifacts /site-config /worker-state"]
    volumes:
      - artifacts:/artifacts
      - site-config:/site-config
      - worker-state:/worker-state
    networks: [javes-internal]
    restart: "no"

  site-config-init:
    build: *service-build
    entrypoint: [sh, -ec]
    command:
      - >-
        if [ -f /site-config/sites/nvidia-mtmc-12cam/nvidia-12cam-v1/site.yaml ]; then
          javes-site-config-nvidia --repository-root /repository --registry-root /site-config --verify-only;
        else
          javes-site-config-nvidia --repository-root /repository --registry-root /site-config;
        fi
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      volume-init: {condition: service_completed_successfully}
    volumes:
      - site-config:/site-config
      - type: bind
        source: ${JAVES_NVIDIA_ROOT:-../../data/nvidia_mtmc/mtmc_12cam}
        target: /repository/data/nvidia_mtmc/mtmc_12cam
        read_only: true
    networks: [javes-internal]
    restart: "no"

  migrate:
    build: *service-build
    entrypoint: [javes-main-migrate]
    command: [upgrade]
    environment:
      JAVES_DATABASE_URL: postgresql+psycopg://javes:${POSTGRES_PASSWORD}@postgres:5432/javes
    depends_on:
      postgres: {condition: service_healthy}
    <<: *hardened
    restart: "no"

  site-config:
    build: *service-build
    entrypoint: [javes-site-config-api]
    command: [--root, /site-config, --host, 0.0.0.0, --port, "8082"]
    environment:
      <<: *telemetry
      JAVES_SITE_CONFIG_SERVICE_TOKEN: ${JAVES_SITE_CONFIG_TOKEN:?set JAVES_SITE_CONFIG_TOKEN}
      JAVES_INSTANCE_ID: site-config-1
    volumes: [site-config:/site-config:ro]
    depends_on:
      site-config-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_healthy}
    <<: *hardened
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: {resources: {limits: {cpus: "1", memory: 512M}}}

  routing:
    build: *service-build
    entrypoint: [javes-routing-api]
    command: [--site-config-url, http://site-config:8082, --host, 0.0.0.0, --port, "8081"]
    environment:
      <<: *telemetry
      JAVES_SITE_CONFIG_SERVICE_TOKEN: ${JAVES_SITE_CONFIG_TOKEN:?set JAVES_SITE_CONFIG_TOKEN}
      JAVES_ROUTING_SERVICE_TOKEN: ${JAVES_ROUTING_TOKEN:?set JAVES_ROUTING_TOKEN}
      JAVES_INSTANCE_ID: routing-1
    depends_on:
      site-config: {condition: service_healthy}
    <<: *hardened
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: {resources: {limits: {cpus: "2", memory: 1G}}}

  archive:
    build: *service-build
    entrypoint: [javes-nvidia-archive-api]
    command: [--root, /nvidia, --manifest, /nvidia/archive-manifest.v1.json, --verify, --host, 0.0.0.0, --port, "8083"]
    environment:
      <<: *telemetry
      JAVES_ARCHIVE_SERVICE_TOKEN: ${JAVES_ARCHIVE_TOKEN:?set JAVES_ARCHIVE_TOKEN}
      JAVES_INSTANCE_ID: archive-1
    volumes:
      - type: bind
        source: ${JAVES_NVIDIA_ROOT:-../../data/nvidia_mtmc/mtmc_12cam}
        target: /nvidia
        read_only: true
    depends_on:
      otel-collector: {condition: service_healthy}
    <<: *hardened
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: {resources: {limits: {cpus: "1", memory: 512M}}}

  main-api:
    build: *service-build
    environment:
      <<: *telemetry
      JAVES_ENVIRONMENT: staging
      JAVES_DATABASE_URL: postgresql+psycopg://javes:${POSTGRES_PASSWORD}@postgres:5432/javes
      JAVES_ARTIFACT_ROOT: /artifacts
      JAVES_ROUTING_URL: http://routing:8081
      JAVES_ROUTING_TOKEN: ${JAVES_ROUTING_TOKEN:?set JAVES_ROUTING_TOKEN}
      JAVES_SITE_CONFIG_URL: http://site-config:8082
      JAVES_SITE_CONFIG_TOKEN: ${JAVES_SITE_CONFIG_TOKEN:?set JAVES_SITE_CONFIG_TOKEN}
      JAVES_ROUTING_PARAMS_VERSION: nvidia-eval-params-v1
      JAVES_PERCEPTION_WORKER_TOKEN: ${JAVES_PERCEPTION_WORKER_TOKEN:?set JAVES_PERCEPTION_WORKER_TOKEN}
      JAVES_CLIP_WORKER_TOKEN: ${JAVES_CLIP_WORKER_TOKEN:?set JAVES_CLIP_WORKER_TOKEN}
      JAVES_RETENTION_WORKER_TOKEN: ${JAVES_RETENTION_WORKER_TOKEN:?set JAVES_RETENTION_WORKER_TOKEN}
      JAVES_WORKER_LEASE_SECRET: ${JAVES_WORKER_LEASE_SECRET:?set JAVES_WORKER_LEASE_SECRET}
      JAVES_INSTANCE_ID: main-api-1
    volumes: [artifacts:/artifacts]
    ports: ["127.0.0.1:${JAVES_CONTROLS_PORT:-8080}:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      volume-init: {condition: service_completed_successfully}
      routing: {condition: service_healthy}
      site-config: {condition: service_healthy}
    <<: *hardened
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy: {resources: {limits: {cpus: "2", memory: 2G}}}

  scheduler:
    build: *service-build
    entrypoint: [javes-main-scheduler]
    environment:
      <<: *telemetry
      JAVES_ENVIRONMENT: staging
      JAVES_DATABASE_URL: postgresql+psycopg://javes:${POSTGRES_PASSWORD}@postgres:5432/javes
      JAVES_ARTIFACT_ROOT: /artifacts
      JAVES_ROUTING_URL: http://routing:8081
      JAVES_ROUTING_TOKEN: ${JAVES_ROUTING_TOKEN:?set JAVES_ROUTING_TOKEN}
      JAVES_SITE_CONFIG_URL: http://site-config:8082
      JAVES_SITE_CONFIG_TOKEN: ${JAVES_SITE_CONFIG_TOKEN:?set JAVES_SITE_CONFIG_TOKEN}
      JAVES_ROUTING_PARAMS_VERSION: nvidia-eval-params-v1
      JAVES_PERCEPTION_WORKER_TOKEN: ${JAVES_PERCEPTION_WORKER_TOKEN:?set JAVES_PERCEPTION_WORKER_TOKEN}
      JAVES_CLIP_WORKER_TOKEN: ${JAVES_CLIP_WORKER_TOKEN:?set JAVES_CLIP_WORKER_TOKEN}
      JAVES_RETENTION_WORKER_TOKEN: ${JAVES_RETENTION_WORKER_TOKEN:?set JAVES_RETENTION_WORKER_TOKEN}
      JAVES_WORKER_LEASE_SECRET: ${JAVES_WORKER_LEASE_SECRET:?set JAVES_WORKER_LEASE_SECRET}
      JAVES_INSTANCE_ID: scheduler-1
    volumes: [artifacts:/artifacts]
    depends_on:
      main-api: {condition: service_healthy}
    <<: *hardened
    healthcheck:
      test: [CMD-SHELL, "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy: {resources: {limits: {cpus: "1", memory: 1G}}}

  perception-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: perception-runtime
    entrypoint: [javes-perception-worker]
    command: [--main-url, http://main-api:8080, --worker-id, perception-1, --config, /config/perception.yaml, --artifact-root, /artifacts, --state-db, /state/perception.sqlite, --archive-url, http://archive:8083]
    environment:
      <<: *telemetry
      JAVES_PERCEPTION_WORKER_TOKEN: ${JAVES_PERCEPTION_WORKER_TOKEN:?set JAVES_PERCEPTION_WORKER_TOKEN}
      JAVES_ARCHIVE_SERVICE_TOKEN: ${JAVES_ARCHIVE_TOKEN:?set JAVES_ARCHIVE_TOKEN}
      JAVES_INSTANCE_ID: perception-1
    volumes:
      - artifacts:/artifacts
      - worker-state:/state
      - ../staging/perception.nvidia.yaml:/config/perception.yaml:ro
      - ${JAVES_MODELS_ROOT:-../../models}:/models:ro
      - ${JAVES_NVIDIA_ROOT:-../../data/nvidia_mtmc/mtmc_12cam}:/nvidia:ro
    depends_on:
      main-api: {condition: service_healthy}
      archive: {condition: service_healthy}
      volume-init: {condition: service_completed_successfully}
    <<: *hardened
    healthcheck:
      test: [CMD-SHELL, "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy: {resources: {limits: {cpus: "4", memory: 8G}}}

  retention-worker:
    build: *service-build
    entrypoint: [javes-retention-worker]
    command: [--main-url, http://main-api:8080, --worker-id, retention-1, --artifact-root, /artifacts, --state-db, /state/retention.sqlite]
    environment:
      <<: *telemetry
      JAVES_RETENTION_WORKER_TOKEN: ${JAVES_RETENTION_WORKER_TOKEN:?set JAVES_RETENTION_WORKER_TOKEN}
      JAVES_INSTANCE_ID: retention-1
    volumes: [artifacts:/artifacts, worker-state:/state]
    depends_on:
      main-api: {condition: service_healthy}
      volume-init: {condition: service_completed_successfully}
    <<: *hardened
    healthcheck:
      test: [CMD-SHELL, "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy: {resources: {limits: {cpus: "1", memory: 1G}}}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [../otel/collector.yaml:/etc/otelcol/config.yaml:ro]
    depends_on:
      observability-backend: {condition: service_started}
    healthcheck:
      test: [CMD, /otelcol-contrib, validate, --config=/etc/otelcol/config.yaml]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [javes-internal]
    deploy: {resources: {limits: {cpus: "1", memory: 512M}}}

  observability-backend:
    image: grafana/otel-lgtm:0.41.0
    restart: unless-stopped
    networks: [javes-internal]
    volumes: [observability-data:/data]
    deploy: {resources: {limits: {cpus: "2", memory: 2G}}}

  reverse-proxy:
    profiles: [tls]
    image: nginx:1.27-alpine
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ../reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${JAVES_TLS_CERT:-../../runtime/tls/tls.crt}:/run/secrets/tls.crt:ro
      - ${JAVES_TLS_KEY:-../../runtime/tls/tls.key}:/run/secrets/tls.key:ro
    ports: ["127.0.0.1:${JAVES_TLS_PORT:-8443}:443"]
    depends_on:
      main-api: {condition: service_healthy}
    restart: unless-stopped
    networks: [javes-internal]

  backup:
    profiles: [backup]
    build: *service-build
    entrypoint: [javes-main-backup]
    command: [backup, /backups/javes.dump]
    environment:
      JAVES_DATABASE_URL: postgresql+psycopg://javes:${POSTGRES_PASSWORD}@postgres:5432/javes
    volumes: ["${JAVES_BACKUP_ROOT:-../../backups}:/backups"]
    depends_on:
      postgres: {condition: service_healthy}
    <<: *hardened
    restart: "no"

networks:
  javes-internal:
    internal: true

volumes:
  postgres-data:
  artifacts:
  site-config:
  worker-state:
  observability-data:
