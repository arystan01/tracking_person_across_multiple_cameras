apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: javes
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: main-boundaries
  namespace: javes
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: javes-main}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: javes-dashboard}}
        - podSelector: {matchLabels: {app.kubernetes.io/role: worker}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: javes-routing}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: javes-site-config}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-boundaries
  namespace: javes
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: javes-dashboard}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/role: reverse-proxy}}
      ports: [{protocol: TCP, port: 8090}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: javes-main}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-egress
  namespace: javes
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
